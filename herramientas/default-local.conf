# =============================================================================
# XNOVA LOCAL - HTTP + API PROXY (Port 80)
# =============================================================================
# Frontend + API reverse proxy en el mismo puerto.
# Sin CORS, sin cross-origin. Todo via localhost:8080.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # API REVERSE PROXY (same-origin, no CORS needed)
    # =========================================================================

    # Auth (GoTrue)
    location /auth/v1/ {
        proxy_pass http://xnova-auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # REST API (PostgREST)
    location /rest/v1/ {
        proxy_pass http://xnova-rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Edge Functions (not available locally - return static data from wallet_config)
    location /functions/v1/ {
        access_log off;
        add_header Content-Type application/json;
    }

    # wallet-info: returns deposit addresses and contract info
    location = /functions/v1/wallet-info {
        access_log off;
        return 200 '{"success":true,"depositAddress":"0x387526aa3f94f5C41e6a47D8c98751273e2214A3","tokenContract":"0x09514EcF8270C12101D077B5e8B034B164F71C5f","chainId":56,"depositsEnabled":true,"config":{"requiredConfirmations":3}}';
        add_header Content-Type application/json;
    }

    # token-price: proxy to Python service (fetches from DexScreener with cache)
    location = /functions/v1/token-price {
        proxy_pass http://172.18.0.1:9001/token-price;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # verify-deposit: proxy to Python deposit service
    location = /functions/v1/verify-deposit {
        proxy_pass http://172.18.0.1:9001/verify-deposit;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # auto-withdraw: proxy to Python deposit service (signs and broadcasts TUNG transfer)
    location = /functions/v1/auto-withdraw {
        proxy_pass http://172.18.0.1:9001/auto-withdraw;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 5s;
    }

    # Other functions not yet implemented
    location ~ ^/functions/v1/(verify-my-telegram) {
        access_log off;
        return 200 '{"success":false,"error":"This feature is coming soon"}';
        add_header Content-Type application/json;
    }

    # Realtime WebSocket - proxy to blackhole server (keeps client happy)
    location /realtime/v1/ {
        access_log off;
        proxy_pass http://172.18.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # =========================================================================
    # STATIC FILES & SPA
    # =========================================================================

    # Service Worker - nunca cachear
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Static assets - cache agresiva (tienen content hash en filename)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Routing - fallback a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
