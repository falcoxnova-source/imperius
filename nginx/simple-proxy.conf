events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # CORS map
    map $http_origin $cors_header {
        default '*';
    }

    server {
        listen 8000;

        # Common CORS headers
        add_header Access-Control-Allow-Origin $cors_header always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, prefer, x-request-id" always;
        add_header Access-Control-Expose-Headers "content-range, x-total-count" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Auth (GoTrue)
        location /auth/v1/ {
            proxy_pass http://xnova-auth:9999/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Strip backend CORS headers to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
        }

        # REST (PostgREST)
        location /rest/v1/ {
            proxy_pass http://xnova-rest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Strip backend CORS headers to avoid duplication
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
        }
    }
}
