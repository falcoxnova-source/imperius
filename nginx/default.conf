# =============================================================================
# XNOVA - HTTP SERVER CONFIGURATION (Port 80)
# =============================================================================
# Este archivo contiene el servidor HTTP (puerto 80).
# El HTTPS (puerto 443) es opcional: renombrar default-ssl.conf.template
# a default-ssl.conf y colocar los certificados en nginx/ssl/
#
# NOTA: Las zonas de rate limiting (req_limit, conn_limit) están definidas
# en nginx.conf (http block) y son compartidas por todos los server blocks.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP SERVER (Port 80)
# Siempre activo. No requiere certificados SSL.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting: 10 req/s por IP, burst de 20
    limit_req zone=req_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # Health check para Docker (rate limit muy alto = sin limite practico)
    location /health {
        access_log off;
        limit_req zone=req_limit burst=1000 nodelay;
        limit_conn conn_limit 100;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Service Worker - nunca cachear
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Static assets - cache agresiva (tienen content hash en filename)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Routing - fallback a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# =============================================================================
# HTTPS OPCIONAL
# Para habilitar HTTPS:
#   1. Genera certs: docker run --rm -v ./nginx/ssl:/ssl alpine sh -c "apk add openssl && openssl req -x509 -newkey rsa:2048 -keyout /ssl/privkey.pem -out /ssl/fullchain.pem -days 3650 -nodes -subj '/CN=localhost'"
#   2. Copia: cp nginx/default-ssl.conf.template nginx/default-ssl.conf
#   3. Reconstruye: docker compose build frontend && docker compose up -d frontend
# =============================================================================
