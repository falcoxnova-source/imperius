# =============================================================================
# XNOVA - NGINX MAIN CONFIGURATION
# =============================================================================
# This is the main Nginx configuration file that controls the web server
# behavior for serving the Xnova game frontend.
#
# Key Features:
#   - Rate limiting: 10 requests/second per IP (burst 20)
#   - Connection limiting: 10 concurrent connections per IP
#   - Gzip compression for optimal performance
#   - Security headers and server token hiding
#
# =============================================================================

# -----------------------------------------------------------------------------
# CORE SETTINGS
# -----------------------------------------------------------------------------
# Run nginx as the nginx user for security
user nginx;

# Auto-detect number of CPU cores for optimal worker processes
worker_processes auto;

# Error log location and minimum severity level
error_log /var/log/nginx/error.log warn;

# Process ID file location
pid /var/run/nginx.pid;

# -----------------------------------------------------------------------------
# EVENTS CONFIGURATION
# Controls how nginx handles connections
# -----------------------------------------------------------------------------
events {
    # Maximum simultaneous connections per worker
    # Formula: max_clients = worker_processes * worker_connections
    worker_connections 1024;

    # Accept multiple connections at once for better performance
    multi_accept on;

    # Use epoll for Linux (most efficient event method)
    use epoll;
}

# -----------------------------------------------------------------------------
# HTTP CONFIGURATION
# Main HTTP server settings
# -----------------------------------------------------------------------------
http {
    # -------------------------------------------------------------------------
    # MIME TYPES
    # -------------------------------------------------------------------------
    # Include standard MIME type definitions
    include /etc/nginx/mime.types;

    # Default MIME type for unknown file extensions
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # LOGGING FORMAT
    # -------------------------------------------------------------------------
    # Custom log format including:
    # - Client IP, user, timestamp
    # - Request details and status code
    # - Response size, referrer, user agent
    # - X-Forwarded-For for proxy chains
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access log location using the main format
    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # RATE LIMITING ZONES
    # Protects against DDoS and brute force attacks
    # -------------------------------------------------------------------------
    # Zone: req_limit
    # - Uses client IP ($binary_remote_addr) as key
    # - 10MB shared memory zone (can track ~160,000 IPs)
    # - Rate: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # Zone: conn_limit
    # - Limits concurrent connections per IP
    # - 10MB shared memory zone
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit response status code (429 = Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # Log rate-limited requests at warn level
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # -------------------------------------------------------------------------
    # PERFORMANCE OPTIMIZATIONS
    # -------------------------------------------------------------------------
    # Use sendfile for efficient file transfers
    sendfile on;

    # Optimize TCP packet sending
    tcp_nopush on;
    tcp_nodelay on;

    # Keep connections alive for 65 seconds
    keepalive_timeout 65;

    # Hash table size for MIME types
    types_hash_max_size 2048;

    # -------------------------------------------------------------------------
    # GZIP COMPRESSION
    # Reduces bandwidth and improves load times
    # -------------------------------------------------------------------------
    gzip on;

    # Disable for old IE versions
    gzip_disable "msie6";

    # Add Vary header for proxies
    gzip_vary on;

    # Compress for all proxied requests
    gzip_proxied any;

    # Compression level (1-9, 6 is good balance)
    gzip_comp_level 6;

    # Buffer settings for compression
    gzip_buffers 16 8k;

    # Minimum HTTP version for compression
    gzip_http_version 1.1;

    # Minimum file size to compress (bytes)
    gzip_min_length 256;

    # File types to compress
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------------------------
    # SECURITY SETTINGS
    # -------------------------------------------------------------------------
    # Hide nginx version from response headers
    server_tokens off;

    # -------------------------------------------------------------------------
    # INCLUDE SERVER CONFIGURATIONS
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
